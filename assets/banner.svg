<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Nexus — FREE AI Router & Token Saver">
  <title>Nexus — FREE AI Router &amp; Token Saver</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="50%" stop-color="#111a35"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#f472b6;#38bdf8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#f472b6;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#f472b6">
        <animate attributeName="stop-color" values="#f472b6;#38bdf8;#818cf8;#f472b6" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e2a52" stroke-width="1" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- pulsing central glow -->
  <ellipse cx="600" cy="200" rx="520" ry="240" fill="url(#glow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- orbiting rings -->
  <g transform="translate(600 200)">
    <circle r="190" fill="none" stroke="#3346a0" stroke-width="1.5" stroke-dasharray="6 10" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle r="240" fill="none" stroke="#3346a0" stroke-width="1" stroke-dasharray="2 14" opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="36s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- flowing data lines -->
  <g fill="none" stroke-linecap="round">
    <path d="M 60 120 Q 300 60 520 180" stroke="#38bdf8" stroke-width="3" stroke-dasharray="12 16" opacity="0.8">
      <animate attributeName="stroke-dashoffset" from="0" to="-56" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 60 300 Q 320 340 540 220" stroke="#f472b6" stroke-width="3" stroke-dasharray="12 16" opacity="0.8">
      <animate attributeName="stroke-dashoffset" from="0" to="-56" dur="1.9s" repeatCount="indefinite"/>
    </path>
    <path d="M 1140 120 Q 900 60 680 180" stroke="#34d399" stroke-width="3" stroke-dasharray="12 16" opacity="0.8">
      <animate attributeName="stroke-dashoffset" from="0" to="-56" dur="1.7s" repeatCount="indefinite"/>
    </path>
    <path d="M 1140 300 Q 900 340 660 220" stroke="#fbbf24" stroke-width="3" stroke-dasharray="12 16" opacity="0.8">
      <animate attributeName="stroke-dashoffset" from="0" to="-56" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- routing nodes -->
  <g>
    <circle cx="60" cy="120" r="7" fill="#0b1020" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="60" cy="300" r="7" fill="#0b1020" stroke="#f472b6" stroke-width="2.5"/>
    <circle cx="1140" cy="120" r="7" fill="#0b1020" stroke="#34d399" stroke-width="2.5"/>
    <circle cx="1140" cy="300" r="7" fill="#0b1020" stroke="#fbbf24" stroke-width="2.5"/>
  </g>

  <!-- pulsing hub nodes -->
  <g>
    <circle cx="520" cy="180" r="6" fill="#38bdf8">
      <animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="540" cy="220" r="6" fill="#f472b6">
      <animate attributeName="r" values="4;8;4" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="180" r="6" fill="#34d399">
      <animate attributeName="r" values="4;8;4" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="660" cy="220" r="6" fill="#fbbf24">
      <animate attributeName="r" values="4;8;4" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- floating particles -->
  <g fill="#94a3b8">
    <circle cx="180" cy="80" r="2.5">
      <animate attributeName="cy" values="80;60;80" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="90" r="2">
      <animate attributeName="cy" values="90;70;90" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="340" r="2">
      <animate attributeName="cy" values="340;320;340" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="330" r="2.5">
      <animate attributeName="cy" values="330;310;330" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="6.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- title -->
  <text x="600" y="205" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="800" letter-spacing="6" fill="url(#titleGrad)">NEXUS</text>

  <!-- subtitle -->
  <text x="600" y="255" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" letter-spacing="3" fill="#c7d2fe">FREE AI Router &amp; Token Saver</text>

  <!-- tagline -->
  <text x="600" y="295" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="1" fill="#8ea0d8">40+ Providers · 100+ Models · Auto-Fallback · 20-40% Token Savings</text>

  <!-- divider line -->
  <line x1="420" y1="320" x2="780" y2="320" stroke="#3346a0" stroke-width="1" opacity="0.8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
  </line>
</svg>
